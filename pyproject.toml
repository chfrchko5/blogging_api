[project]
name = "blogging-api"
version = "0.1.0"
description = "blogging api python application"
authors = [
    {name = "chfrchko5",email = "r4ger7@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "blogging_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
